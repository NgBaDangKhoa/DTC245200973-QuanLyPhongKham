version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: clinic_postgres
    environment:
      POSTGRES_USER: clinic_admin
      POSTGRES_PASSWORD: StrongPassword123!
      POSTGRES_DB: clinic_db
    networks:
      - backend-net
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: clinic_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@clinic.com
      PGADMIN_DEFAULT_PASSWORD: StrongPassword123!
    ports:
      - "5050:80"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - postgres-db

  clinic-app:
    build: ./app
    container_name: clinic_app
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - postgres-db
    restart: always

  nginx:
    image: nginx:alpine
    container_name: clinic_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
    depends_on:
      - clinic-app

  prometheus:
    image: prom/prometheus:latest
    container_name: clinic_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - frontend-net

  grafana:
    image: grafana/grafana:latest
    container_name: clinic_grafana
    ports:
      - "3000:3000"
    networks:
      - frontend-net

  loki:
    image: grafana/loki:2.9.0
    container_name: clinic_loki
    ports:
      - "3100:3100"
    networks:
      - frontend-net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: clinic_promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
    networks:
      - frontend-net